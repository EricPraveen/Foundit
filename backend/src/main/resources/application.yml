server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: campusfind-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:prefer}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        show_sql: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

# Storage configuration
app:
  storage:
    provider: ${STORAGE_PROVIDER:local}
    bucket: ${SUPABASE_STORAGE_BUCKET:found-items}
    local:
      upload-dir: ${LOCAL_UPLOAD_DIR:uploads/found-items}
    supabase:
      url: ${SUPABASE_URL:https://peozkhpdwvrctmqroqau.supabase.co}
      service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  reputation:
    enabled: ${REPUTATION_ENABLED:true}
    default-handover-points: ${REPUTATION_DEFAULT_HANDOVER_POINTS:10}
    default-collection-points: ${REPUTATION_DEFAULT_COLLECTION_POINTS:0}
  notification:
    email-enabled: ${EMAIL_NOTIFICATIONS_ENABLED:true}
    max-email-retries: ${EMAIL_MAX_RETRIES:3}
    email-retry-delay-seconds: ${EMAIL_RETRY_DELAY_SECONDS:300}
    unclaimed-enabled: ${UNCLAIMED_ESCALATION_ENABLED:false}
    unclaimed-threshold-days: ${UNCLAIMED_THRESHOLD_DAYS:30}
    base-url: ${APP_BASE_URL:http://localhost:5173}
  scheduling:
    handover-reminder-cron: ${HANDOVER_REMINDER_CRON:0 0 * * * *}
    unclaimed-escalation-cron: ${UNCLAIMED_ESCALATION_CRON:0 0 2 * * *}
    email-retry-cron: ${EMAIL_RETRY_CRON:0 */5 * * * *}

# Actuator Health & Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_DETAILS:never}
      probes:
        enabled: true
  info:
    env:
      enabled: false

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_UI_ENABLED:true}
    operationsSorter: method

# Security & Authentication
jwt:
  secret: ${JWT_SECRET:defaultSecureFounditUniversityJwtSecretKey2026MoratuwaCampusFindAuth}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

auth:
  verification-token-expiry-hours: ${AUTH_VERIFICATION_TOKEN_EXPIRY_HOURS:24}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

