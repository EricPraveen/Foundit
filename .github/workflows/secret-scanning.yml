name: GitGuardian Secret Scanning

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitguardian-scan:
    name: GitGuardian ggshield Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify GitGuardian secret availability
        id: check-auth
        env:
          GG_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          if [ -n "$GG_API_KEY" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "GITGUARDIAN_API_KEY is configured in GitHub Secrets. Proceeding with ggshield scan."
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice title=GitGuardian Secret Missing::GITGUARDIAN_API_KEY secret is not yet configured in GitHub Repository Secrets. Scan skipped. Please configure GITGUARDIAN_API_KEY to activate automated secret leak protection."
          fi

      - name: Run GitGuardian ggshield scan
        if: steps.check-auth.outputs.configured == 'true'
        uses: GitGuardian/ggshield-action@v1
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
