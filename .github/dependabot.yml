version: 2
updates:
  # Monitor Maven dependencies for Spring Boot backend
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Colombo"
    open-pull-requests-limit: 10
    groups:
      spring-dependencies:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework:*"
      test-frameworks:
        patterns:
          - "org.junit*:*"
          - "org.mockito:*"

  # Monitor npm dependencies for React frontend (active once initialized in Phase 3)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Colombo"
    open-pull-requests-limit: 10

  # Monitor GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
